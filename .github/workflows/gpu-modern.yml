name: Modern WebGPU comparison
on:
  push:
    branches: [feature/performance14-webgpu]
    paths: [.github/workflows/gpu-modern.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        revision: [170, 187]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install matching official build in temporary checkout only
        run: |
          mkdir -p gpu-diagnostic
          if [ '${{ matrix.revision }}' = 187 ]; then
            npm pack three@0.187.0 --silent
            mkdir -p /tmp/three-modern vendor/three-r187
            tar -xzf three-0.187.0.tgz -C /tmp/three-modern
            cp /tmp/three-modern/package/build/*.js vendor/three-r187/
            printf "export * from './three-r187/three.webgpu.js';\nexport {WebGLRenderer} from './three-r187/three.module.js';\n" > vendor/three.module.js
            npm view three@0.187.0 dist.integrity > gpu-diagnostic/integrity.txt
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('renderer-policy.js')
          p.write_text(p.read_text().replace("if(typeof transparentPass==='function')", "if(THREE.REVISION==='170'&&typeof transparentPass==='function')"))
          p=Path('tests/browser-gpu-diagnostic.mjs')
          s=p.read_text().replace("headless:true,args:","headless:false,channel:'chromium',args:")
          s=s.replace("'--use-angle=swiftshader'","'--use-angle=vulkan','--enable-gpu','--enable-features=Vulkan','--disable-vulkan-surface'")
          s=s.replace("const variants=['normal','no-shadows','no-points','no-menu-preview','no-precompile','no-effects'];", "const variants=['normal','no-effects'];")
          s=s.replace("results.push({variant,state,messages});", "await page.screenshot({path:resolve(out,variant+'-presented.png')});const data=await page.evaluate(()=>{const a=__gpuProbe;a.renderer.render(a.scene,a.camera);return a.renderer.domElement.toDataURL('image/png');});await writeFile(resolve(out,variant+'-raw.png'),Buffer.from(data.split(',')[1],'base64'));results.push({variant,state,messages});")
          p.write_text(s)
          PY
      - run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libvulkan1 mesa-vulkan-drivers
      - run: xvfb-run -a -s '-screen 0 1600x1000x24' env DEBUG=pw:browser node tests/browser-gpu-diagnostic.mjs 2>&1 | tee gpu-diagnostic/browser.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-headed-${{ matrix.revision }}
          path: gpu-diagnostic/
          retention-days: 7
