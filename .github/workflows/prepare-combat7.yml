name: Prepare and validate combat7
on:
  push:
    branches: [codex/prepare-combat7-20261107]
    paths: ['.release-combat7/**', '.github/workflows/prepare-combat7.yml']
permissions:
  contents: write
jobs:
  validate:
    if: github.ref == 'refs/heads/codex/prepare-combat7-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Finalize unarmed HUD with exact source and output hashes
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip() == '1af0add0c2f651f1966f8f4c9cf45c453d998f58'
          changes=json.loads(pathlib.Path('.release-combat7/hud.json').read_text())
          assert set(changes)=={'game.js','tests/game.integration.mjs'}
          for name,c in changes.items():
              p=pathlib.Path(name);raw=p.read_bytes()
              assert hashlib.sha256(raw).hexdigest()==c['before'], 'Unexpected source: '+name
              text=raw.decode('utf-8')
              for old,new in c['pairs']:
                  assert text.count(old)==1, 'Ambiguous replacement: '+name
                  text=text.replace(old,new)
              raw=text.encode('utf-8')
              assert hashlib.sha256(raw).hexdigest()==c['after'], 'Unexpected result: '+name
              p.write_bytes(raw)
              print(c['after'],name)
          PY
          git diff --check
      - name: Run the full regression suite on the final source
        run: npm test
      - name: Store final validated candidate on preparation branch only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- game.js tests/game.integration.mjs
          git commit -m 'Validate complete combat7 build with consistent unarmed HUD'
          git push origin HEAD:refs/heads/codex/prepare-combat7-20261107
          echo "VALIDATED_COMMIT=$(git rev-parse HEAD)"
          echo "VALIDATED_TREE=$(git rev-parse HEAD^{tree})"
