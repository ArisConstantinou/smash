name: Verify portrait melee update
on:
  push:
    branches: [work/portrait-melee-build-20261106]
    paths: [tools/portrait-payload/04.b64]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct the exact tested source on the original release
        shell: bash
        run: |
          set -euo pipefail
          cp tools/portrait-manifest.json /tmp/portrait-manifest.json
          cat tools/portrait-payload/0{1,2,3,4}.b64 > /tmp/portrait-payload.b64
          git checkout --detach e126c48e33e4caab056ba942bc49d318a9ed7992
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib
          manifest = json.loads(pathlib.Path('/tmp/portrait-manifest.json').read_text())
          encoded = pathlib.Path('/tmp/portrait-payload.b64').read_text()
          edits = json.loads(lzma.decompress(base64.b64decode(encoded)))
          assert set(edits) == set(manifest), 'Unexpected file list'
          for name, operations in edits.items():
              path = pathlib.Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              lines = path.read_text().splitlines(keepends=True) if path.exists() else []
              for start, end, replacement in reversed(operations):
                  assert 0 <= start <= end <= len(lines)
                  lines[start:end] = [replacement]
              data = ''.join(lines).encode()
              actual = hashlib.sha256(data).hexdigest()
              assert actual == manifest[name], f'Hash mismatch: {name}: {actual}'
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          print(f'Verified {len(manifest)} exact source files.')
          PY
          git diff --check
      - name: Run all regression tests
        run: npm test
      - name: Publish a tested source commit without the transfer workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md audio.js character-progression.js combat-feedback.js combat-visibility.js docs/portrait-qa.json game.js hammer-motion.js index.html mobile-hud.css models.js tests/audio.test.mjs tests/combat-feedback.test.mjs tests/game.integration.mjs tests/hammer-motion.test.mjs tests/models.test.mjs
          git commit -m 'Polish portrait HUD, two-handed melee, sound, combos and combat visibility'
          git push origin HEAD:refs/heads/work/portrait-melee-tested-20261106
          echo "Tested commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
