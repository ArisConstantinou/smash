name: Render and verify impact4
on:
  push:
    branches: [verify/impact4-20261106]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node tools/verify-impact4.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: impact4-browser-evidence
          path: browser-evidence/
          retention-days: 3
