name: Prepare recorded combat audio
on:
  push:
    branches: [audio-recorded-sfx]
    paths: ['.github/workflows/audio-assets.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download licensed source recordings
        shell: python
        run: |
          import hashlib,json,pathlib,urllib.request
          out=pathlib.Path('audio-sources');out.mkdir()
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://kenney.nl/assets/impact-sounds'})
            with urllib.request.urlopen(req,timeout=40) as r: return r.read(20000000),r.headers.get('Content-Type','')
          link,_=get('https://kenney.nl/download-link/6173736574732f696d706163742d736f756e6473')
          signed=json.loads(link)['url']
          sources={'impact.zip':signed,'hero.wav':'https://opengameart.org/sites/default/files/Valiant%20Genericus%20%28Effort%20Noises%29.wav'}
          for i in range(1,7): sources[f'hurt_{i:02}.mp3']=f'https://opengameart.org/sites/default/files/hurt_{i:02}.mp3'
          report={}
          for name,url in sources.items():
            data,kind=get(url)
            if 'text/html' in kind or len(data)<256: raise ValueError('Invalid asset: '+name)
            (out/name).write_bytes(data)
            report[name]={'url':'https://kenney.nl/assets/impact-sounds' if name=='impact.zip' else url,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          (out/'sources.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: licensed-audio-sources
          path: audio-sources/
          retention-days: 7
