name: Build and validate recorded combat audio
on:
  push:
    branches: [audio-recorded-sfx]
    paths: ['.github/workflows/audio-assets.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio-recorded-sfx
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply tested implementation
        run: |
          git apply --check audio-upgrade.patch
          git apply audio-upgrade.patch
          git diff --check
      - name: Install audio encoder
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Build hash-verified licensed recordings
        run: python3 tools/build-audio.py
      - name: Run complete regression suite
        run: |
          set -o pipefail
          npm test | tee audio-validation.log
      - name: Commit validated implementation to preparation branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio.js audio-samples.js game.js index.html style.css tests/audio.test.mjs tests/audio-samples.test.mjs tools/build-audio.py assets/audio
          git commit -m 'Add recorded material impacts, human vocals and explicit mobile audio test'
          git push origin HEAD:audio-recorded-sfx
          git rev-parse HEAD > validated-commit.txt
          git archive --format=tar HEAD > validated-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: validated-recorded-audio
          path: |
            validated-source.tar
            validated-commit.txt
            audio-validation.log
          retention-days: 7
