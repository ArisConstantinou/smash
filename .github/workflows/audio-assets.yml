name: Prepare recorded combat audio
on:
  push:
    branches: [audio-recorded-sfx]
    paths: ['.github/workflows/audio-assets.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download licensed source recordings
        shell: python
        run: |
          import hashlib, json, pathlib, time, urllib.request
          out = pathlib.Path('audio-sources'); out.mkdir()
          sources = {
            'impact.zip': ['https://kenney.nl/media/pages/assets/impact-sounds/87b4ddecda-1677589768/kenney_impact-sounds.zip'],
            'hero.wav': ['https://opengameart.org/sites/default/files/Valiant%20Genericus%20%28Effort%20Noises%29.wav', 'https://lpc.opengameart.org/sites/default/files/Valiant%20Genericus%20%28Effort%20Noises%29.wav'],
          }
          for i in range(1, 7):
            sources[f'hurt_{i:02}.mp3'] = [f'https://opengameart.org/sites/default/files/hurt_{i:02}.mp3', f'https://lpc.opengameart.org/sites/default/files/hurt_{i:02}.mp3']
          report = {}
          for name, urls in sources.items():
            errors = []
            for url in urls:
              try:
                req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (IRONFALL asset preparation)'})
                with urllib.request.urlopen(req, timeout=40) as response:
                  data = response.read(20000000)
                  if 'text/html' in response.headers.get('Content-Type', ''): raise ValueError('Expected audio/archive, received HTML')
                if len(data) < 256: raise ValueError('Empty asset')
                (out/name).write_bytes(data)
                report[name] = {'url': url, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}
                break
              except Exception as error:
                errors.append(str(error))
            else:
              report[name] = {'errors': errors}
          (out/'sources.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: licensed-audio-sources
          path: audio-sources/
          retention-days: 7
