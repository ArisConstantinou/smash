name: Performance lab
on:
  push:
    branches: [feature/webgpu-wasm-perf14]
    paths: [.github/workflows/performance-lab.yml, tools/gpu-probe.mjs, performance.patch]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  investigate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned engine and browser tools
        run: |
          npm install --no-save --package-lock=false three@0.186.0 playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Strict WebGPU capability probe
        run: node tools/gpu-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-probe
          path: gpu-probe*
          retention-days: 3
