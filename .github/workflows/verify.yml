name: Verify Ironfall

on:
  push:
    branches: [main, feature/forge-menu-platforms, feature/barbed-wire-aim13]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gameplay, geometry and audio regressions
        run: npm test
      - name: Check patch whitespace
        run: git diff --check HEAD^

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Functional mount workshop and save isolation
        run: SMASH_WORKSHOP_SERVER=1 SMASH_WORKSHOP_RENDERER=webgl node tests/browser-mount-workshop.mjs
      - name: Desktop and mobile browser checks
        run: node tests/browser-smoke.mjs
      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ironfall-browser-evidence
          path: browser-evidence/
          if-no-files-found: warn
          retention-days: 7
