name: Validate horizontal opener and ground throw arrow
on:
  push:
    branches: [prepare-aim12-20261107]
    paths: ['.aim12-transfer/**', '.github/workflows/aim12-prepare.yml']
permissions:
  contents: write
concurrency:
  group: aim12-preparation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply checksummed changes to the reviewed base
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          root = pathlib.Path.cwd()
          raw = lzma.decompress(base64.b64decode((root / '.aim12-transfer/payload.b64').read_text(), validate=True))
          assert hashlib.sha256(raw).hexdigest() == '592dd644b1677e94095e1c73ad8f42e4262c786374e6128554d66f26ead4052d'
          payload = json.loads(raw)
          assert payload['base'] == 'a8398bbfa1f005d7d87e8cad441fcaa05d956d9a'
          assert subprocess.check_output(['git','rev-parse','HEAD^'], text=True).strip() == payload['base']
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert len(payload['files']) == 10
          paths = []
          for entry in payload['files']:
              relative = pathlib.PurePosixPath(entry['path'])
              assert not relative.is_absolute() and '..' not in relative.parts
              assert relative.parts[0] not in ('.git','.github','.aim12-transfer')
              path = root / relative
              assert path.resolve().is_relative_to(root)
              if entry['base'] is None:
                  assert not path.exists()
                  result = entry['text'].encode('utf-8')
              else:
                  original = path.read_bytes()
                  assert blob(original) == entry['base'], str(relative)
                  lines = original.decode('utf-8').splitlines(keepends=True)
                  for start,end,replacement in reversed(entry['edits']):
                      assert 0 <= start <= end <= len(lines)
                      lines[start:end] = replacement.splitlines(keepends=True)
                  result = ''.join(lines).encode('utf-8')
              assert blob(result) == entry['sha'], str(relative)
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(result)
              paths.append(str(relative))
              print('Verified',relative,entry['sha'])
          pathlib.Path('/tmp/aim12-files.txt').write_text('\n'.join(paths)+'\n')
          PY
      - name: Run all gameplay and geometry regressions
        run: |
          set -euo pipefail
          npm test 2>&1 | tee /tmp/aim12-tests.log
      - name: Install isolated browser dependency
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify desktop and mobile input and ground arrow rendering
        run: node tests/browser-smoke.mjs
      - name: Commit validated source only to the preparation branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mapfile -t files < /tmp/aim12-files.txt
          git add -- "${files[@]}"
          git diff --cached --check
          python3 - <<'PY'
          import json, subprocess, pathlib
          paths = subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          entries = [{'path':p,'mode':'100644','type':'blob','sha':subprocess.check_output(['git','rev-parse',':'+p],text=True).strip()} for p in paths]
          pathlib.Path('/tmp/aim12-manifest.json').write_text(json.dumps(entries,indent=2))
          print(json.dumps(entries,indent=2))
          PY
          git commit -m 'Validate horizontal combo openers and illustrated ground throw arrow'
          git push origin HEAD:refs/heads/prepare-aim12-20261107
          echo "Validated commit: $(git rev-parse HEAD)"
          echo "Validated tree: $(git rev-parse HEAD^{tree})"
      - name: Keep browser screenshots and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aim12-evidence
          path: |
            browser-evidence/
            /tmp/aim12-manifest.json
            /tmp/aim12-tests.log
          if-no-files-found: warn
          retention-days: 7
