name: Validate combat11
on:
  push:
    branches: [prepare-combat11-20261107]
    paths: ['.combat11-transfer/**', '.github/workflows/combat11-prepare.yml']
permissions:
  contents: write
concurrency:
  group: combat11-preparation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply checksummed combat changes
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          root = pathlib.Path.cwd()
          encoded = ''.join((root / f'.combat11-transfer/payload-{i}.b64').read_text() for i in range(3))
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '7cc61b94bb62df0cb5bd9c9d7188ba75005ce8dc193877e197543a4252a8d139'
          payload = json.loads(raw)
          assert payload['base'] == '8eb76bc589288cb11974e369ad65a815343b89f8'
          assert subprocess.check_output(['git','rev-parse','HEAD^'], text=True).strip() == payload['base']
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert len(payload['files']) == 16
          paths = []
          for entry in payload['files']:
              relative = pathlib.PurePosixPath(entry['path'])
              assert not relative.is_absolute() and '..' not in relative.parts
              assert relative.parts[0] not in ('.git','.github','.combat11-transfer')
              path = root / relative
              assert path.resolve().is_relative_to(root)
              if entry['base'] is None:
                  assert not path.exists(), str(relative)
                  result = entry['text'].encode('utf-8')
              else:
                  original = path.read_bytes()
                  assert blob(original) == entry['base'], str(relative)
                  lines = original.decode('utf-8').splitlines(keepends=True)
                  for start,end,replacement in reversed(entry['edits']):
                      assert 0 <= start <= end <= len(lines)
                      lines[start:end] = replacement.splitlines(keepends=True)
                  result = ''.join(lines).encode('utf-8')
              assert blob(result) == entry['sha'], str(relative)
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(result)
              paths.append(str(relative))
              print('Verified',relative,entry['sha'])
          pathlib.Path('/tmp/combat11-files.txt').write_text('\n'.join(paths)+'\n')
          PY
      - name: Run gameplay geometry input and pooling regressions
        run: |
          set -euo pipefail
          npm test 2>&1 | tee /tmp/combat11-tests.log
      - name: Install isolated browser dependency
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify real touch input spin momentum and bounded WebGL resources
        run: node tests/browser-smoke.mjs
      - name: Measure repeatable combat CPU scenarios
        run: node tools/benchmark-combat.mjs > /tmp/combat11-benchmark.json
      - name: Commit validated source to preparation branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mapfile -t files < /tmp/combat11-files.txt
          git add -- "${files[@]}"
          git diff --cached --check
          python3 - <<'PY'
          import json, subprocess, pathlib
          paths = subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          entries = [{'path':p,'mode':'100644','type':'blob','sha':subprocess.check_output(['git','rev-parse',':'+p],text=True).strip()} for p in paths]
          pathlib.Path('/tmp/combat11-manifest.json').write_text(json.dumps(entries,indent=2))
          print(json.dumps(entries,indent=2))
          PY
          git commit -m 'Validate manual combat, contact-powered spin and bounded battle effects'
          git push origin HEAD:refs/heads/prepare-combat11-20261107
          echo "Validated commit: $(git rev-parse HEAD)"
          echo "Validated tree: $(git rev-parse HEAD^{tree})"
      - name: Keep verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat11-evidence
          path: |
            browser-evidence/
            /tmp/combat11-manifest.json
            /tmp/combat11-tests.log
            /tmp/combat11-benchmark.json
          if-no-files-found: warn
          retention-days: 7
