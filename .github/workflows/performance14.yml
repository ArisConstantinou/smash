name: Verify performance14
on:
  push:
    branches: [feature/performance14-webgpu]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: performance14
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Archive the exact source under test
        run: |
          git archive --format=tar HEAD > /tmp/performance14-source.tar
          mkdir -p browser-evidence/perf14
          git rev-parse HEAD > browser-evidence/perf14/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: performance14-source
          path: /tmp/performance14-source.tar
          retention-days: 3
      - name: Logic geometry audio and WASM equivalence
        run: npm test | tee browser-evidence/unit-tests.log
      - name: Reproducible CPU collision benchmark
        if: ${{ !cancelled() }}
        run: node --import ./tools/node-environment.mjs tools/collision-benchmark.mjs | tee browser-evidence/perf14/collision-benchmark.json
      - name: Browser dependency
        if: ${{ !cancelled() }}
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libvulkan1 mesa-vulkan-drivers
      - name: Strict WebGPU and WASM real-browser validation
        if: ${{ !cancelled() }}
        run: xvfb-run -a -s '-screen 0 1600x1000x24' env DEBUG=pw:browser node tests/browser-performance14.mjs 2>&1 | tee browser-evidence/perf14/browser-test.log
      - name: Keep early WebGPU evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: performance14-webgpu-evidence
          path: browser-evidence/perf14/
          retention-days: 7
      - name: Desktop and mobile compatibility regression
        if: ${{ !cancelled() }}
        run: node tests/browser-smoke.mjs
      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance14-evidence
          path: browser-evidence/
          if-no-files-found: warn
          retention-days: 7
